name: Mise à jour des courses

on:
  schedule:
    - cron: "0 3 * * 1"   # chaque lundi à 5 h (heure de Paris en été)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - name: Cache du géocodage
        uses: actions/cache@v4
        with:
          path: cache
          key: geo-${{ github.run_id }}
          restore-keys: geo-

      - name: Tests des analyseurs
        run: python tests/test_parsers.py

      - name: Collecte FFA + FFTri
        run: python scraper/build.py --mois 11

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
